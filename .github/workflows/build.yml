name: Build Prism

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27 and check for the iOS 27.1 SDK
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -q "iphoneos27\.[1-9]"; then
            echo "::error::This runner has no iOS 27.1 SDK yet. Installed SDKs:"
            xcodebuild -showsdks
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Prism.xcodeproj \
            -scheme Prism \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Prism.app Payload/
          zip -qr Prism.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Prism-ipa
          path: Prism.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  screenshots:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for the client ID secret
        run: |
          if [ -z "$REDDIT_CLIENT_ID" ]; then
            echo "::warning::Add a REDDIT_CLIENT_ID repository secret to get screenshots."
            echo "SKIP_SHOTS=1" >> "$GITHUB_ENV"
          fi

      - name: Select Xcode 27
        if: env.SKIP_SHOTS != '1'
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        if: env.SKIP_SHOTS != '1'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        if: env.SKIP_SHOTS != '1'
        run: |
          set -o pipefail
          xcodebuild \
            -project Prism.xcodeproj \
            -scheme Prism \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -20

      - name: Take screenshots
        if: env.SKIP_SHOTS != '1'
        run: .github/scripts/screenshots.sh

      - name: Upload screenshots
        if: env.SKIP_SHOTS != '1'
        uses: actions/upload-artifact@v4
        with:
          name: Prism-screenshots
          path: screenshots
